name: Steam Mobile - Build IPA v2 (signing fix + Xcode 27)
on:
  push:
    branches: [steam-mobile-engine-sm001]
    paths:
      - ".github/workflows/steam-mobile-build-ipa.yml"
      - "SteamMobile/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-engine-attempt:
    name: Native engine build attempt (experimental)
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode environment
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -E 'iOS|iphoneos'
          swift --version | grep -E 'Swift version 6\.4|Swift version 6\.5'
      - name: Install Apple's Metal shader toolchain (Xcode 27)
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
          xcrun --find metal
      - name: Fetch Madeira source and current DXMT implementation
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch main https://github.com/willfaust/Madeira.git "$RUNNER_TEMP/Madeira"
          git clone --quiet --depth 1 --branch ios-port https://github.com/willfaust/dxmt.git "$RUNNER_TEMP/Madeira/dxmt"
          git clone --quiet --depth 1 --branch ios-port-2607 https://github.com/willfaust/FEX.git "$RUNNER_TEMP/Madeira/FEX"
          # Dependencies used by the FEX iOS CMake build, not just its headers.
          git -C "$RUNNER_TEMP/Madeira/FEX" submodule update --init --depth 1 \
            External/vixl External/fmt External/xxhash \
            External/range-v3 External/unordered_dense
          echo "Engine source fetched: Madeira + DXMT + FEX + required FEX headers"
      - name: Apply genuine DXMT and Wine emulation patches
        shell: bash
        run: |
          set -euo pipefail
          python3 SteamMobile/tools/patch_native_engine.py --madeira "$RUNNER_TEMP/Madeira" --dxmt "$RUNNER_TEMP/Madeira/dxmt" --apply
          python3 SteamMobile/tests/verify_engine.py --madeira "$RUNNER_TEMP/Madeira" --dxmt "$RUNNER_TEMP/Madeira/dxmt"
      - name: Generate FEX headers and compile native iOS FEXCore
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          # Generated headers do not exist in the FEX source checkout.
          # Compiling the actual targets generates ConfigValues.inl and
          # ConfigOptions.inl, and their required static libraries.
          bash "$RUNNER_TEMP/Madeira/build/fex-ios/build.sh" 2>&1 | tee "$RUNNER_TEMP/SteamMobileFEXBuild.log"
          test -s "$RUNNER_TEMP/Madeira/FEX/build-ios/include/FEXCore/Config/ConfigValues.inl"
          test -s "$RUNNER_TEMP/Madeira/FEX/build-ios/include/FEXCore/Config/ConfigOptions.inl"
          test -s "$RUNNER_TEMP/Madeira/FEX/build-ios/FEXCore/Source/libFEXCore.a"
          test -s "$RUNNER_TEMP/Madeira/FEX/build-ios/FEXCore/Source/libFEXCore_Base.a"
      - name: Require real native build libraries and licensed CRT binaries
        shell: bash
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/Madeira"
          missing=0
          # Do not create empty stand-ins. Upstream's clean-checkout
          # docs/BUILDING.md records these unbundled/unreproducible inputs.
          for rel in \
            app/Madeira/libdxmt_combined.a \
            app/Madeira/libntdll_unix.a \
            app/Madeira/libwineserver.a \
            app/Madeira/libwin32u_unix.a \
            app/Madeira/libmadeira_rppairing.a \
            app/Madeira/libavformat.a \
            app/Madeira/libavcodec.a \
            app/Madeira/libswresample.a \
            app/Madeira/libavutil.a; do
            if [[ ! -s "$R/$rel" ]]; then
              echo "::error file=$rel::Missing real iOS static library (upstream docs/BUILDING.md)"
              missing=1
            fi
          done
          if [[ ! -d "$R/app/Madeira/x86_64-vcruntime" ]] || \
             [[ -z "$(find "$R/app/Madeira/x86_64-vcruntime" -type f -iname '*.dll' -print -quit 2>/dev/null)" ]]; then
            echo "::error::Missing licensed Microsoft x64 VC runtime DLLs"
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            echo "::error::Native prerequisites unavailable: no valid optimized IPA can be produced from this checkout."
            exit 1
          fi
          bash "$R/build/stage-licenses.sh"
      - name: Attempt complete Debug device build with Xcode
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project "$RUNNER_TEMP/Madeira/app/Madeira.xcodeproj" \
            -scheme Madeira -configuration Debug -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/SteamMobileDerived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/SteamMobileNativeBuild.log"
      - name: Package native patched IPA ONLY after successful Xcode build
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/SteamMobileDerived/Build/Products/Debug-iphoneos/Madeira.app"
          test -s "$APP/Madeira"
          # Never publish a purportedly complete engine with an empty
          # Microsoft x64 CRT resource set.
          test -n "$(find "$APP/x86_64-vcruntime" -type f -name '*.dll' -print -quit)"
          mkdir -p "$RUNNER_TEMP/nativeipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/nativeipa/Payload/"
          (cd "$RUNNER_TEMP/nativeipa" && zip -qry "$RUNNER_TEMP/native_unrepacked.ipa" Payload)
          python3 SteamMobile/tools/repack_ipa_for_signing.py             "$RUNNER_TEMP/native_unrepacked.ipa"             "$GITHUB_WORKSPACE/SteamMobile_Engine_SM001_unsigned.ipa"             --bundle-id com.steammobile.engine --name "Steam Mobile"
      - name: Upload actually compiled native IPA
        uses: actions/upload-artifact@v4
        with:
          name: SteamMobile_Engine_SM001_unsigned
          path: SteamMobile_Engine_SM001_unsigned.ipa
          if-no-files-found: error
      - name: Save build diagnostics on failure
        if: failure()
        shell: bash
        run: |
          test ! -f "$RUNNER_TEMP/SteamMobileNativeBuild.log" || cp "$RUNNER_TEMP/SteamMobileNativeBuild.log" "$GITHUB_WORKSPACE/SteamMobile_native_build.log"
          test ! -f "$RUNNER_TEMP/SteamMobileFEXBuild.log" || cp "$RUNNER_TEMP/SteamMobileFEXBuild.log" "$GITHUB_WORKSPACE/SteamMobile_fex_build.log"
          echo "See upstream Madeira docs/BUILDING.md: extra native libraries/toolchains and licensed CRT DLLs are required. The baseline IPA does NOT contain SM-001 patches." > SteamMobile_native_build_readme.txt
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SteamMobile_native_build_diagnostics
          path: |
            SteamMobile_native_build.log
            SteamMobile_fex_build.log
            SteamMobile_native_build_readme.txt
          if-no-files-found: warn

  playable-baseline-ipa:
    name: Produce separate Steam Mobile baseline IPA (upstream engine)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download published upstream Madeira IPA and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 3 --silent --show-error \
            "https://github.com/willfaust/Madeira/releases/download/v0.1.3/Madeira-0.1.3.ipa" \
            -o "$RUNNER_TEMP/Madeira-0.1.3.ipa"
          curl -fL --retry 3 --retry-delay 3 --silent --show-error \
            "https://github.com/willfaust/Madeira/releases/download/v0.1.3/Madeira-0.1.3.ipa.sha256" \
            -o "$RUNNER_TEMP/Madeira-0.1.3.ipa.sha256"
          EXPECTED="$(grep -Eo '[0-9a-fA-F]{64}' "$RUNNER_TEMP/Madeira-0.1.3.ipa.sha256" | head -n1 | tr '[:upper:]' '[:lower:]')"
          ACTUAL="$(shasum -a 256 "$RUNNER_TEMP/Madeira-0.1.3.ipa" | cut -d' ' -f1)"
          test -n "$EXPECTED"
          test "$EXPECTED" = "$ACTUAL"
          echo "Verified official Madeira v0.1.3 release IPA: $ACTUAL"
      - name: Repair matching bundle IDs and remove stale signature resources
        shell: bash
        run: |
          set -euo pipefail
          python3 SteamMobile/tools/repack_ipa_for_signing.py             "$RUNNER_TEMP/Madeira-0.1.3.ipa"             "$GITHUB_WORKSPACE/SteamMobile_Baseline_v0_1_3_InstallFix_unsigned.ipa"             --bundle-id com.steammobile.baseline --name "Steam Mobile"
      - name: Check matched app extension and re-signing prerequisites
        shell: bash
        run: |
          python3 - <<'PY'
          import plistlib, zipfile
          z=zipfile.ZipFile('SteamMobile_Baseline_v0_1_3_InstallFix_unsigned.ipa')
          base=plistlib.loads(z.read('Payload/Madeira.app/Info.plist'))
          ext=plistlib.loads(z.read('Payload/Madeira.app/PlugIns/MadeiraJITHelper.appex/Info.plist'))
          assert base['CFBundleIdentifier']=='com.steammobile.baseline'
          assert ext['CFBundleIdentifier']=='com.steammobile.baseline.JITHelper'
          assert not any('/_CodeSignature/' in n for n in z.namelist())
          assert z.testzip() is None
          print('PASS: matched JIT helper, no stale signature resources, intact IPA')
          PY
      - name: Explain difference from experimental engine
        shell: bash
        run: |
          cat > SteamMobile_Baseline_README.txt <<'TXT'
          Steam Mobile Baseline v0.1.3
          ============================
          This is a REPACKAGED official Madeira v0.1.3 release with a separate
          iOS bundle ID and Steam Mobile display name. The engine binaries are
          UNMODIFIED and do NOT contain the new SM-001 DX9/Wine optimizations.
          No new Steam achievements or DLSS features are included.
          For experiments, this is a working-code baseline, not an FPS upgrade.
          This is UNSIGNED: sign ALL code with your sideloading certificate before install.\n          Main app + JIT helper now have matching bundle identifiers.\n          Signature-resource files were stripped; the app was not signed by GitHub.
          Upstream GPL-3.0-or-later source:
          https://github.com/willfaust/Madeira/tree/v0.1.3
          Project docs: https://github.com/willfaust/Madeira
          TXT
      - name: Upload actual IPA and explanation
        uses: actions/upload-artifact@v4
        with:
          name: SteamMobile_Baseline_v0_1_3_InstallFix_unsigned
          path: |
            SteamMobile_Baseline_v0_1_3_InstallFix_unsigned.ipa
            SteamMobile_Baseline_README.txt
          if-no-files-found: error
