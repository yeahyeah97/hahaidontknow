name: Steam Mobile - native engine validation
on:
  push:
    branches: [steam-mobile-engine-sm001]
    paths:
      - 'SteamMobile/**'
      - '.github/workflows/steam-mobile-engine-ci.yml'
  pull_request:
    branches: [steam-mobile-engine-sm001]
    paths:
      - 'SteamMobile/**'
      - '.github/workflows/steam-mobile-engine-ci.yml'
  workflow_dispatch:
jobs:
  dx9-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Madeira and DXMT engine sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/steam-mobile/Madeira/app/Madeira/Winios
          mkdir -p /tmp/steam-mobile/dxmt/src/d3d9
          curl -fL --retry 3 --silent --show-error https://raw.githubusercontent.com/willfaust/Madeira/48f976429c189f8396e23d251d8a82f43c705922/app/Madeira/Winios/Winios.m -o /tmp/steam-mobile/Madeira/app/Madeira/Winios/Winios.m
          curl -fL --retry 3 --silent --show-error https://raw.githubusercontent.com/willfaust/Madeira/48f976429c189f8396e23d251d8a82f43c705922/app/Madeira/FEXBridge.mm -o /tmp/steam-mobile/Madeira/app/Madeira/FEXBridge.mm
          curl -fL --retry 3 --silent --show-error https://raw.githubusercontent.com/willfaust/Madeira/48f976429c189f8396e23d251d8a82f43c705922/app/Madeira/JITPairing.swift -o /tmp/steam-mobile/Madeira/app/Madeira/JITPairing.swift
          curl -fL --retry 3 --silent --show-error https://raw.githubusercontent.com/willfaust/Madeira/48f976429c189f8396e23d251d8a82f43c705922/app/Madeira/MadeiraApp.swift -o /tmp/steam-mobile/Madeira/app/Madeira/MadeiraApp.swift
          curl -fL --retry 3 --silent --show-error https://raw.githubusercontent.com/willfaust/dxmt/db546ee466ad50ec6463edb5fa183de11db43761/src/d3d9/d3d9_multithread.hpp -o /tmp/steam-mobile/dxmt/src/d3d9/d3d9_multithread.hpp
      - name: Dry-run native patch checks
        run: |
          python3 SteamMobile/tools/patch_native_engine.py --madeira /tmp/steam-mobile/Madeira --dxmt /tmp/steam-mobile/dxmt --check
      - name: Apply native engine patches to disposable upstream copies
        run: |
          python3 SteamMobile/tools/patch_native_engine.py --madeira /tmp/steam-mobile/Madeira --dxmt /tmp/steam-mobile/dxmt --apply
      - name: Compile patched DXMT lock and check Wine/FEX hot-path guards
        run: |
          python3 SteamMobile/tests/verify_engine.py --madeira /tmp/steam-mobile/Madeira --dxmt /tmp/steam-mobile/dxmt
      - name: Reject fake/partial optimized IPA fixtures
        run: python3 SteamMobile/tests/test_package_guard.py
      - name: Run host-only DX9 recursive-lock microbenchmark
        run: |
          c++ -std=c++17 -O3 -pthread SteamMobile/tests/bench_dx9_lock.cpp -o /tmp/steam-d9-lock-bench
          /tmp/steam-d9-lock-bench
