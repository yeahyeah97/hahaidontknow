name: Build G2 LAB IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate clean G2 LAB app icon
        run: |
          cat > /tmp/make_icon.swift <<'SWIFT'
          import AppKit

          let size = 1024
          guard let rep = NSBitmapImageRep(
              bitmapDataPlanes: nil,
              pixelsWide: size,
              pixelsHigh: size,
              bitsPerSample: 8,
              samplesPerPixel: 3,
              hasAlpha: false,
              isPlanar: false,
              colorSpaceName: .deviceRGB,
              bytesPerRow: 0,
              bitsPerPixel: 0
          ), let graphics = NSGraphicsContext(bitmapImageRep: rep) else {
              fatalError("Unable to create icon bitmap")
          }

          NSGraphicsContext.saveGraphicsState()
          NSGraphicsContext.current = graphics

          let canvas = NSRect(x: 0, y: 0, width: size, height: size)
          NSColor(calibratedRed: 0.025, green: 0.023, blue: 0.040, alpha: 1).setFill()
          canvas.fill()

          let glow = NSGradient(colors: [
              NSColor(calibratedRed: 0.36, green: 0.12, blue: 0.78, alpha: 1),
              NSColor(calibratedRed: 0.10, green: 0.055, blue: 0.20, alpha: 1)
          ])!
          glow.draw(in: canvas, angle: 90)

          let purple = NSColor(calibratedRed: 0.58, green: 0.24, blue: 0.98, alpha: 1)
          purple.setStroke()

          let lensLeft = NSBezierPath(roundedRect: NSRect(x: 142, y: 525, width: 315, height: 190), xRadius: 82, yRadius: 82)
          lensLeft.lineWidth = 22
          lensLeft.stroke()

          let lensRight = NSBezierPath(roundedRect: NSRect(x: 567, y: 525, width: 315, height: 190), xRadius: 82, yRadius: 82)
          lensRight.lineWidth = 22
          lensRight.stroke()

          let bridge = NSBezierPath()
          bridge.move(to: NSPoint(x: 457, y: 620))
          bridge.curve(to: NSPoint(x: 567, y: 620), controlPoint1: NSPoint(x: 492, y: 650), controlPoint2: NSPoint(x: 532, y: 650))
          bridge.lineWidth = 20
          bridge.stroke()

          let g2Style: [NSAttributedString.Key: Any] = [
              .font: NSFont.systemFont(ofSize: 250, weight: .black),
              .foregroundColor: NSColor.white,
              .kern: -10
          ]
          let g2 = NSAttributedString(string: "G2", attributes: g2Style)
          let g2Size = g2.size()
          g2.draw(at: NSPoint(x: (CGFloat(size) - g2Size.width) / 2, y: 220))

          let labStyle: [NSAttributedString.Key: Any] = [
              .font: NSFont.systemFont(ofSize: 80, weight: .bold),
              .foregroundColor: purple,
              .kern: 14
          ]
          let lab = NSAttributedString(string: "LAB", attributes: labStyle)
          let labSize = lab.size()
          lab.draw(at: NSPoint(x: (CGFloat(size) - labSize.width) / 2, y: 135))

          NSGraphicsContext.restoreGraphicsState()

          let output = "G2LAB/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          guard let data = rep.representation(using: .png, properties: [:]) else {
              fatalError("Unable to encode icon")
          }
          try data.write(to: URL(fileURLWithPath: output))
          print("Generated clean 1024x1024 RGB G2 LAB icon at \(output)")
          SWIFT
          swift /tmp/make_icon.swift
          sips -g pixelWidth -g pixelHeight -g format -g space G2LAB/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
      - name: Download bundled Italian streaming ASR model
        run: |
          set -euo pipefail
          MODEL_DIR="G2LAB/Resources/Models/KrokoIT"
          BASE="https://huggingface.co/Banafo/Kroko-ASR/resolve/c71bb4008f7c3255e13e780122f1f45a62d6559e"
          mkdir -p "$MODEL_DIR"
          curl -L --fail --retry 3 "$BASE/it_encoder.onnx?download=true" -o "$MODEL_DIR/it_encoder.onnx"
          curl -L --fail --retry 3 "$BASE/it_decoder.onnx?download=true" -o "$MODEL_DIR/it_decoder.onnx"
          curl -L --fail --retry 3 "$BASE/it_joiner.onnx?download=true" -o "$MODEL_DIR/it_joiner.onnx"
          curl -L --fail --retry 3 "$BASE/it_tokens.txt?download=true" -o "$MODEL_DIR/it_tokens.txt"
          ls -lh "$MODEL_DIR"
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project G2LAB.xcodeproj -scheme G2LAB
      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild -project G2LAB.xcodeproj -scheme G2LAB -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build | tee build.log
      - name: Package unsigned IPA
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/G2LAB.app"
          test -d "$APP"
          rm -rf Payload G2_LAB_v0.2.1-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry G2_LAB_v0.2.1-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: G2_LAB_v0.2.1_unsigned_IPA
          path: G2_LAB_v0.2.1-unsigned.ipa
          retention-days: 7
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: G2_LAB_build_log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
