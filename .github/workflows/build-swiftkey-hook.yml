name: Build SwiftKey Patch Runtime

on:
  push:
    branches: [ swiftkey-mod ]
    paths:
      - 'SwiftKeyPatch/**'
      - '.github/workflows/build-swiftkey-hook.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build arm64 iOS hooks
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          clang -fobjc-arc -dynamiclib -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=16.0 \
            -framework UIKit -framework Foundation -framework Security -framework CoreGraphics \
            -install_name "@rpath/DeafKeyHook.dylib" \
            SwiftKeyPatch/DeafKeyHook.m \
            -o DeafKeyHook.dylib

          clang -fobjc-arc -dynamiclib -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=16.0 \
            -framework UIKit -framework Foundation \
            -install_name "@rpath/DeafKeyHostHook.dylib" \
            SwiftKeyPatch/DeafKeyHostHook.m \
            -o DeafKeyHostHook.dylib

          file DeafKeyHook.dylib DeafKeyHostHook.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: DeafKeyRuntime
          path: |
            DeafKeyHook.dylib
            DeafKeyHostHook.dylib
