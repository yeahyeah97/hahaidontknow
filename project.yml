name: G2LAB
options:
  bundleIdPrefix: com.g2lab
  deploymentTarget:
    iOS: '16.0'
packages:
  MentraBluetoothSDK:
    url: https://github.com/Mentra-Community/mentra-bluetooth-sdk-ios.git
    exactVersion: 3.2.1-beta.429
  SherpaOnnx:
    url: https://github.com/k2-fsa/sherpa-onnx.git
    exactVersion: 1.13.8
targets:
  G2LAB:
    type: application
    platform: iOS
    sources:
      - G2LAB
      - path: ThirdParty/liblc3/src
        includes: ["*.c", "*.h"]
    resources:
      - G2LAB/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.g2lab.app
        MARKETING_VERSION: 0.4.3
        CURRENT_PROJECT_VERSION: 10
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.9
        SWIFT_OBJC_BRIDGING_HEADER: G2LAB/G2LAB-Bridging-Header.h
        OTHER_CFLAGS:
          - "$(inherited)"
          - "-include"
          - "$(SRCROOT)/ThirdParty/liblc3/g2_namespace.h"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/ThirdParty/liblc3/include"
          - "$(SRCROOT)/ThirdParty/liblc3/src"
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ''
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: G2 LAB
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: G2 LAB connects to Even Realities G2 over Bluetooth.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: G2 LAB uses microphone audio for captions and accessibility features when enabled.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: G2 LAB uses on-device speech recognition for offline captions.
        INFOPLIST_KEY_UIBackgroundModes:
          - bluetooth-central
          - fetch
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    dependencies:
      - package: MentraBluetoothSDK
        product: MentraBluetoothSDK
      - package: SherpaOnnx
        product: sherpa-onnx

