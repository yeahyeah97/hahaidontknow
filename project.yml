name: MilazyKeyboard
options:
  bundleIdPrefix: com.milazy
  deploymentTarget:
    iOS: '16.0'
targets:
  MilazyKeyboard:
    type: application
    platform: iOS
    sources: [MilazyApp, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milazy.keyboard
        INFOPLIST_FILE: MilazyApp/Info.plist
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: MilazyKeyboardExtension
  MilazyKeyboardExtension:
    type: app-extension
    platform: iOS
    sources: [MilazyKeyboard, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milazy.keyboard.extension
        INFOPLIST_FILE: MilazyKeyboard/Info.plist
        CODE_SIGNING_ALLOWED: NO
        SKIP_INSTALL: YES
