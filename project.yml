name: MilazyKeyboard
options:
  bundleIdPrefix: com.milazy
  deploymentTarget:
    iOS: '16.0'
targets:
  MilazyKeyboard:
    type: application
    platform: iOS
    sources:
      - MilazyApp
      - path: Shared
        excludes: [Resources]
      - path: Shared/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milazy.keyboard
        INFOPLIST_FILE: MilazyApp/Info.plist
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: MilazyKeyboardExtension
  MilazyKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - MilazyKeyboard
      - path: Shared
        excludes: [Resources]
      - path: Shared/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milazy.keyboard.extension
        INFOPLIST_FILE: MilazyKeyboard/Info.plist
        CODE_SIGNING_ALLOWED: NO
        SKIP_INSTALL: YES



  MilazyTypingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MilazyKeyboard
        excludes: [Info.plist]
      - path: Shared
        excludes: [Resources]
      - Tests/UIKitTypingTests.swift
      - Tests/Support
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milazy.typingtests
        INFOPLIST_FILE: Tests/TypingTestInfo.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: MilazyKeyboard
  MilazyTouchHarness:
    type: application
    platform: iOS
    sources:
      - path: MilazyKeyboard
        excludes: [Info.plist]
      - path: Shared
        excludes: [Resources]
      - path: Shared/Resources
        buildPhase: resources
      - Tests/TouchHarnessAppDelegate.swift
      - Tests/Support
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milazy.touchharness
        INFOPLIST_FILE: MilazyApp/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  MilazyTouchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/TouchRoutingUITests.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milazy.touchuitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: MilazyTouchHarness
    dependencies:
      - target: MilazyTouchHarness
schemes:
  MilazyKeyboard:
    build:
      targets:
        MilazyKeyboard: all
  MilazyTypingTests:
    build:
      targets:
        MilazyKeyboard: all
        MilazyTypingTests: [test]
        MilazyTouchHarness: [test]
        MilazyTouchUITests: [test]
    test:
      targets: [MilazyTypingTests, MilazyTouchUITests]

